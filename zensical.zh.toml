# Documentation site (Zensical, by the Material for MkDocs team):
#   uvx zensical serve            # preview at http://localhost:8000
#   tools/build-docs.sh           # site/ with the Dokka API reference under site/api/
# Code shown on the site comes from compiled sources through `--8<--` snippets
# (demo/src/main/kotlin/dev/ai/elements/demo/samples/DocsSamples.kt), so it cannot rot.

[project]
site_name = "AI Elements for Kotlin · 中文"
site_description = "面向 Android AI 应用的 Jetpack Compose 组件与 Agent 工具。组件实图、中英文接入指南与公开协议支持。"
site_url = "https://junelegency.github.io/ai-elements-kotlin/zh/"
repo_url = "https://github.com/JuneLeGency/ai-elements-kotlin"
repo_name = "ai-elements-kotlin"
edit_uri = "edit/main/docs/zh/"
copyright = "Apache License 2.0"
docs_dir = "docs/zh"
site_dir = "site/zh"
extra_css = ["assets/stylesheets/landing.css"]
exclude_docs = """
GOAL.md
zh/**
"""

nav = [
  { "首页" = "index.md" },
  { "快速开始" = [
    { "选择接入方式" = "getting-started/choose.md" },
    { "安装与环境" = "getting-started/installation.md" },
    { "连接服务端 Agent" = "getting-started/pure-client.md" },
    { "在 App 内运行 Agent" = "getting-started/in-app-agent.md" },
    { "常见问题" = "getting-started/faq.md" },
  ] },
  { "组件图册" = [
    "components/index.md", "components/conversation.md", "components/content.md",
    "components/tools.md", "components/human-in-the-loop.md", "components/agent-structure.md",
    "components/generative-ui.md", "components/attachments-and-media.md", "components/voice.md",
    "components/developer-tools.md", "components/workflow.md", "components/supporting.md",
  ] },
  { "使用指南" = [
    "guides/elements.md", "guides/customizing.md", "guides/human-in-the-loop.md", "guides/harness.md",
    "guides/generative-ui.md", "guides/steps-and-replay.md", "guides/notifications.md",
    "guides/custom-backend.md",
  ] },
  { "协议" = ["protocols/index.md", "protocols/ai-sdk.md", "protocols/ag-ui.md", "protocols/mcp.md", "protocols/mcp-apps.md", "protocols/a2a.md", "protocols/acp.md", "protocols/model-apis.md"] },
  { "架构" = ["concepts/architecture.md", "concepts/open-protocols.md"] },
  { "开发与发布" = ["develop/reference-server.md", "develop/demo-app.md", "develop/testing.md", "develop/contributing.md", "develop/releasing.md"] },
  { "项目" = ["project/roadmap.md", "project/changelog.md", "project/security.md"] },
  { "版本与兼容性" = "develop/api-compatibility.md" },
  { "API 参考（英文）" = "/ai-elements-kotlin/api/index.html" },
]

[project.theme]
language = "zh"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "deep-purple"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "deep-purple"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统主题"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.extra]
alternate = [
  { name = "English", link = "/ai-elements-kotlin/", lang = "en" },
  { name = "简体中文", link = "/ai-elements-kotlin/zh/", lang = "zh" },
]
