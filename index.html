<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON STRIKE - FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  #game-container { width: 100vw; height: 100vh; position: relative; }
  canvas { display: block; }

  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #0ff;
    box-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
  }
  #crosshair::before { width: 20px; height: 2px; top: -1px; left: -10px; }
  #crosshair::after { width: 2px; height: 20px; top: -10px; left: -1px; }
  #crosshair .dot {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #0ff; top: -2px; left: -2px;
    box-shadow: 0 0 10px #0ff;
  }

  #hud {
    position: absolute; bottom: 30px; left: 30px; z-index: 10;
    color: #0ff; text-shadow: 0 0 10px #0ff;
  }
  #hud .hp-bar {
    width: 250px; height: 14px; border: 1px solid #0ff;
    box-shadow: 0 0 10px rgba(0,255,255,0.5), inset 0 0 5px rgba(0,255,255,0.3);
    margin-top: 6px;
  }
  #hp-fill {
    height: 100%; background: linear-gradient(90deg, #f0f, #0ff);
    box-shadow: 0 0 10px #0ff;
    transition: width 0.3s;
  }
  #hud .label { font-size: 13px; letter-spacing: 3px; }

  #score-hud {
    position: absolute; top: 30px; right: 30px; z-index: 10;
    color: #f0f; text-shadow: 0 0 10px #f0f; text-align: right;
  }
  #score-hud .score { font-size: 40px; font-weight: bold; }
  #score-hud .label { font-size: 12px; letter-spacing: 4px; }
  #score-hud .kills { font-size: 18px; color: #0ff; text-shadow: 0 0 10px #0ff; margin-top: 4px; }

  #ammo-hud {
    position: absolute; bottom: 30px; right: 30px; z-index: 10;
    color: #ff0; text-shadow: 0 0 10px #ff0; text-align: right;
  }
  #ammo-hud .ammo { font-size: 42px; font-weight: bold; }
  #ammo-hud .label { font-size: 12px; letter-spacing: 4px; }

  #overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,0,20,0.85) 0%, rgba(0,0,0,0.95) 100%);
    cursor: pointer;
  }
  #overlay h1 {
    font-size: 72px; color: #0ff; letter-spacing: 12px;
    text-shadow: 0 0 20px #0ff, 0 0 40px #f0f;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 20px #0ff, 0 0 40px #f0f; }
    50% { text-shadow: 0 0 40px #0ff, 0 0 80px #f0f, 0 0 100px #f0f; }
  }
  #overlay .sub { color: #f0f; font-size: 16px; letter-spacing: 6px; margin-top: 20px; text-shadow: 0 0 10px #f0f; }
  #overlay .controls { color: #888; font-size: 13px; margin-top: 50px; line-height: 2; text-align: center; }
  #overlay .start { color: #ff0; font-size: 18px; margin-top: 40px; letter-spacing: 4px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  #damage-vignette {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    box-shadow: inset 0 0 150px 60px rgba(255,0,50,0.8);
    opacity: 0; transition: opacity 0.4s;
  }
  #hit-marker {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(45deg);
    width: 30px; height: 30px; z-index: 11; pointer-events: none; opacity: 0;
  }
  #hit-marker::before, #hit-marker::after {
    content: ''; position: absolute; background: #f00; box-shadow: 0 0 10px #f00;
  }
  #hit-marker::before { width: 100%; height: 3px; top: 50%; transform: translateY(-50%); }
  #hit-marker::after { width: 3px; height: 100%; left: 50%; transform: translateX(-50%); }

  #muzzle-flash {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,200,0.9) 0%, rgba(255,180,50,0.5) 40%, transparent 70%);
    z-index: 9; pointer-events: none; opacity: 0;
  }

  #gameover {
    position: absolute; inset: 0; z-index: 30;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
  }
  #gameover h1 { font-size: 80px; color: #f00; letter-spacing: 10px; text-shadow: 0 0 30px #f00; }
  #gameover .final { color: #0ff; font-size: 28px; margin-top: 30px; text-shadow: 0 0 10px #0ff; }
  #gameover .restart { color: #ff0; font-size: 18px; margin-top: 50px; letter-spacing: 4px; cursor: pointer; animation: blink 1.2s infinite; }
</style>
</head>
<body>
<div id="game-container">
  <div id="crosshair"><div class="dot"></div></div>
  <div id="damage-vignette"></div>
  <div id="muzzle-flash"></div>
  <div id="hit-marker"></div>

  <div id="hud">
    <div class="label">HULL INTEGRITY</div>
    <div class="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
    <div class="label" style="margin-top:8px">SHIELD <span id="shield-val" style="color:#0ff">100</span></div>
  </div>

  <div id="score-hud">
    <div class="label">SCORE</div>
    <div class="score" id="score">0</div>
    <div class="kills" id="kills">KILLS: 0</div>
  </div>

  <div id="ammo-hud">
    <div class="ammo"><span id="ammo">8</span> / <span id="reserve">∞</span></div>
    <div class="label">PULSE RIFLE</div>
  </div>

  <div id="overlay">
    <h1>NEON STRIKE</h1>
    <div class="sub">FIRST PERSON CYBER COMBAT</div>
    <div class="controls">
      WASD — 移动 | MOUSE — 视角 | CLICK — 射击<br>
      SHIFT — 冲刺 | SPACE — 跳跃 | R — 换弹
    </div>
    <div class="start">[ CLICK TO ENGAGE ]</div>
  </div>

  <div id="gameover">
    <h1>SYSTEM FAILURE</h1>
    <div class="final">FINAL SCORE: <span id="final-score">0</span></div>
    <div class="restart">[ CLICK TO REBOOT ]</div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
