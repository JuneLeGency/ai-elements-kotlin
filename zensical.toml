# Documentation site (Zensical, by the Material for MkDocs team):
#   uvx zensical serve            # preview at http://localhost:8000
#   tools/build-docs.sh           # site/ with the Dokka API reference under site/api/
# Code shown on the site comes from compiled sources through `--8<--` snippets
# (demo/src/main/kotlin/dev/ai/elements/demo/samples/DocsSamples.kt), so it cannot rot.

[project]
site_name = "AI Elements for Kotlin"
site_description = "Jetpack Compose components and agent tooling for AI apps on Android, on open protocols only."
site_url = "https://junelegency.github.io/ai-elements-kotlin/"
repo_url = "https://github.com/JuneLeGency/ai-elements-kotlin"
repo_name = "ai-elements-kotlin"
edit_uri = "edit/main/docs/"
copyright = "Apache License 2.0"
docs_dir = "docs"
site_dir = "site"
exclude_docs = """
GOAL.md
"""

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "getting-started/installation.md",
    "getting-started/choose.md",
    "getting-started/pure-client.md",
    "getting-started/in-app-agent.md",
  ] },
  { "Protocols" = [
    "protocols/index.md",
    "protocols/ai-sdk.md",
    "protocols/ag-ui.md",
    "protocols/a2a.md",
    "protocols/acp.md",
    "protocols/mcp.md",
    "protocols/mcp-apps.md",
    "protocols/model-apis.md",
  ] },
  { "Guides" = [
    "guides/elements.md",
    "guides/human-in-the-loop.md",
    "guides/steps-and-replay.md",
    "guides/generative-ui.md",
    "guides/customizing.md",
    "guides/custom-backend.md",
    "guides/harness.md",
  ] },
  { "Components" = [
    "components/index.md",
    "components/conversation.md",
    "components/content.md",
    "components/tools.md",
    "components/human-in-the-loop.md",
    "components/agent-structure.md",
    "components/generative-ui.md",
    "components/attachments-and-media.md",
    "components/voice.md",
    "components/developer-tools.md",
    "components/workflow.md",
  ] },
  { "Concepts" = [
    "concepts/architecture.md",
    "concepts/open-protocols.md",
  ] },
  { "Develop" = [
    "develop/reference-server.md",
    "develop/demo-app.md",
    "develop/testing.md",
    "develop/contributing.md",
  ] },
  { "Project" = [
    "project/roadmap.md",
    "project/changelog.md",
    "project/security.md",
  ] },
  { "API reference" = "api/index.html" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "deep-purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "deep-purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
