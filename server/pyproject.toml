[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2",
    "ag-ui-protocol>=1.0.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pydantic-ai>=2.55.0",
    "pydantic-ai-harness[acp,skills]>=0.55.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "a2ui-core",
]

[tool.uv.sources]
a2ui-core = { git = "https://github.com/google/A2UI", subdirectory = "python/a2ui_core" }

# The lock file records where packages come from: pin the public index so it stays portable
# (a machine's own mirror in uv.toml would otherwise end up in uv.lock).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
