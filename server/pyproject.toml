[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.1",
    "ag-ui-protocol>=1.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic-ai>=2.53.0",
    "pydantic-ai-harness[acp,skills]>=0.53.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "a2ui-core",
]

[tool.uv.sources]
a2ui-core = { git = "https://github.com/google/A2UI", subdirectory = "python/a2ui_core" }
