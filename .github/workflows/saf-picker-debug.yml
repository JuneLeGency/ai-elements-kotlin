name: SAF picker diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  picker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build test APKs
        run: |
          ./gradlew :demo:assembleDebug :demo:assembleDebugAndroidTest
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Reproduce the picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 3072M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            adb install -r demo/build/outputs/apk/debug/demo-debug.apk
            adb install -r demo/build/outputs/apk/androidTest/debug/demo-debug-androidTest.apk
            adb shell am instrument -w -e class dev.ai.elements.demo.SharedFoldersTest dev.ai.elements.demo.test/androidx.test.runner.AndroidJUnitRunner > saf-picker.log
            cat saf-picker.log
            grep -F 'OK (1 test)' saf-picker.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: saf-picker-diagnosis
          path: saf-picker.log
