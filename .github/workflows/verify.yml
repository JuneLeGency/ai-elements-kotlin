name: Verify

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Release version (reusable workflow)
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: echo "ORG_GRADLE_PROJECT_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Release validation tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: API baseline, unit tests, lint and release build
        run: ./gradlew apiCheck testDebugUnitTest lintDebug :demo:assembleRelease --continue
      - name: Independent consumers of the published AARs and BOM
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: tools/check-published-consumer.sh "$RELEASE_VERSION"
      - uses: astral-sh/setup-uv@v7
      - name: Documentation site (Zensical + Dokka API reference)
        run: tools/build-docs.sh
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The emulator's userdata partition needs ~7 GB; the runner image leaves less. Drop toolchains
      # this job does not use (before setup-java, which installs into the tool cache).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The reference server (Pydantic AI + Harness, scripted model: no keys) for the live E2E tests;
      # the emulator reaches it at 10.0.2.2:8788.
      - uses: astral-sh/setup-uv@v7
      - name: Start the reference agent server
        working-directory: server
        run: |
          uv sync
          nohup uv run uvicorn main:app --host 0.0.0.0 --port 8788 > ../server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8788/health && break; sleep 2; done
          curl --fail http://127.0.0.1:8788/health
      # Build every APK before the emulator boots: compiling beside a 4-core emulator starves the
      # runner (the emulator's threads hang and the job is lost). With the emulator up, Gradle only
      # installs and runs.
      - name: Build the test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest
          # Free the compile daemons' memory for the emulator (the runner is killed when it runs out).
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: UI end-to-end tests (live-model cases skip without a model)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # All four runner cores and enough memory: with two cores, slow frames time out streaming tests.
          cores: 4
          ram-size: 3072M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          # The check fails the job when a module's test process died before reporting (0 tests).
          script: |
            ./gradlew connectedDebugAndroidTest --max-workers=2
            python3 tools/check-android-test-results.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-reports
          path: |
            **/build/reports/androidTests/
            server.log
