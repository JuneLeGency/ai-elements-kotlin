name: Release

# Push a tag `vX.Y.Z` to publish X.Y.Z to Maven Central and create the GitHub release (notes from
# CHANGELOG.md's `## X.Y.Z` section, the demo APK attached).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  a Central Portal user token (central.sonatype.com)
#   SIGNING_KEY / SIGNING_KEY_PASSWORD               the ASCII-armoured GPG private key and its passphrase
# and the `io.github.junelegency` namespace verified on the Central Portal.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          grep -q "^## $VERSION" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || { echo "Maven Central / signing secrets are not set"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test
        run: ./gradlew testDebugUnitTest lintDebug -PVERSION_NAME=$VERSION
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME=$VERSION
      - name: Demo APK
        run: |
          ./gradlew :demo:assembleRelease -PVERSION_NAME=$VERSION
          cp demo/build/outputs/apk/release/demo-release.apk "ai-elements-demo-$VERSION.apk"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version's CHANGELOG section, up to the next `## ` heading.
          awk -v v="## $VERSION" 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "ai-elements-demo-$VERSION.apk" --title "$VERSION" --notes-file notes.md
