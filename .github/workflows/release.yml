name: Release

# Push a tag `vX.Y.Z` to publish X.Y.Z to Maven Central and create the GitHub release (notes from
# CHANGELOG.md's `## X.Y.Z` section, the demo APK attached).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  a Central Portal user token (central.sonatype.com)
#   SIGNING_KEY / SIGNING_KEY_PASSWORD               the ASCII-armoured GPG private key and its passphrase
# and the `io.github.junelegency` namespace verified on the Central Portal.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Validate the release candidate
        run: |
          python3 tools/validate_release.py "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  release:
    needs: [validate, checks]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check publishing credentials
        run: |
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || { echo "Maven Central / signing secrets are not set"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Demo APK
        run: |
          ./gradlew :demo:assembleRelease -PVERSION_NAME=$VERSION
          cp demo/build/outputs/apk/release/demo-release.apk "ai-elements-demo-$VERSION.apk"
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME=$VERSION
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version's CHANGELOG section, up to the next `## ` heading.
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "ai-elements-demo-$VERSION.apk" --title "$VERSION" --notes-file notes.md
