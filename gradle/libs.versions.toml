[versions]
agp = "9.4.0"
kotlin = "2.4.20"
# Google-latest toolchain: AGP 9.4.0 + Gradle 9.7.1 + Kotlin 2.4.20 unlock
# Compose 1.12.1. We pin the individual Compose modules (not the BOM) so the
# exact stable release is deterministic; Material3 Expressive 1.4.0 carries the
# AI-native look. Compose compiler ships with Kotlin 2.x (no separate extension).
composeUi = "1.12.1"
composeFoundation = "1.12.1"
composeMaterial3 = "1.4.0"
composeMaterialIcons = "1.7.8"
composeAnimation = "1.12.1"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.11.0"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
okhttp = "4.12.0"
securityCrypto = "1.1.0-alpha07"
junit = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"
androidxTest = "1.7.0"

[libraries]
# --- Compose (1.12.1 / Material3 1.4.0 Expressive, requires AGP 9.x + Gradle 9.x) ---
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeUi" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeFoundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "composeFoundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIcons" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "composeAnimation" }
compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "composeAnimation" }

# --- AndroidX / Activity / Lifecycle ---
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# --- Kotlin coroutines / serialization ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Network (gateway backends) ---
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# --- Encrypted SharedPreferences (API keys) ---
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# --- Testing ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeUi" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeUi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: AGP 9.x ships built-in Kotlin support — the `org.jetbrains.kotlin.android`
# plugin is removed (and must NOT be applied). Compose compiler still comes from
# `org.jetbrains.kotlin.plugin.compose`; serialization from its own plugin.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
