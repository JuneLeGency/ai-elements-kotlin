[versions]
agp = "9.4.0"
kotlin = "2.4.20"
# Material 3 Expressive (MaterialExpressiveTheme, LoadingIndicator, MaterialShapes,
# ButtonGroup, MotionScheme.expressive) only ships in the 1.5 alpha line; it pulls
# Compose 1.13.0-alpha01, which we pin explicitly so resolution is predictable.
compose = "1.13.0-alpha01"
material3 = "1.5.0-alpha29"
material3Adaptive = "1.3.0"
composeMaterialIcons = "1.7.8"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
profileinstaller = "1.4.1"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
okhttp = "4.12.0"
kotlinJsonPatch = "1.0.0"
a2aJavaSdk = "1.3.2.Final"
aguiKotlin = "0.4.1"
commonsCompress = "1.28.0"
work = "2.12.0"
documentfile = "1.1.0"
koog = "1.3.0"
# Ktor as used by Koog 1.3.0 (its HTTP layer); OkHttp is the Android engine.
ktor = "3.3.3"
desugarJdkLibs = "2.1.5"
androidxBrowser = "1.9.0"
markdownRenderer = "0.45.0"
highlights = "1.1.0"
cmpMermaid = "0.1.7"
junit = "4.13.2"
junitExt = "1.2.1"
androidxTest = "1.7.0"
uiautomator = "2.4.0"

[libraries]
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material3-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3" }
compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }
compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIcons" }

profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# Official A2A Java SDK (A2A 1.0) and its Android HTTP client.
a2a-java-sdk-client = { group = "org.a2aproject.sdk", name = "a2a-java-sdk-client", version.ref = "a2aJavaSdk" }
a2a-java-sdk-http-client-android = { group = "org.a2aproject.sdk", name = "a2a-java-sdk-http-client-android", version.ref = "a2aJavaSdk" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }
# Official AG-UI Kotlin SDK: protocol types and serializers.
agui-kotlin-core = { group = "com.ag-ui.community", name = "kotlin-core", version.ref = "aguiKotlin" }
# Background agent runs (harness-scheduler).
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
koog-agents-core = { group = "ai.koog", name = "agents-core", version.ref = "koog" }
koog-agents-event-handler = { group = "ai.koog", name = "agents-features-event-handler", version.ref = "koog" }
koog-client-openai = { group = "ai.koog", name = "prompt-executor-openai-client", version.ref = "koog" }
koog-client-anthropic = { group = "ai.koog", name = "prompt-executor-anthropic-client", version.ref = "koog" }
koog-client-ollama = { group = "ai.koog", name = "prompt-executor-ollama-client", version.ref = "koog" }
koog-http-ktor = { group = "ai.koog", name = "http-client-ktor", version.ref = "koog" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
koog-agents-test = { group = "ai.koog", name = "agents-test", version.ref = "koog" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# tar.gz extraction with symlinks (the sandbox root filesystem).
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
# RFC 6902 JSON Patch over kotlinx.serialization — the same library the AG-UI Kotlin SDK uses.
kotlin-json-patch = { group = "io.github.reidsync", name = "kotlin-json-patch", version.ref = "kotlinJsonPatch" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidxBrowser" }

markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
cmp-mermaid-compose = { group = "io.github.swithun-liu", name = "mermaid-compose", version.ref = "cmpMermaid" }
highlights = { group = "dev.snipme", name = "highlights", version.ref = "highlights" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTest" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

[plugins]
vanniktech-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9.x has built-in Kotlin; `org.jetbrains.kotlin.android` must not be applied.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
