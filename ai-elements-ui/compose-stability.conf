# Types the Compose compiler should treat as stable in ai-elements-ui.
# The core module has no Compose dependency, so its immutable models need to be declared here
# for elements taking them (Message, ChatState, parts…) to skip recomposition by value.
dev.ai.elements.core.model.*
dev.ai.elements.core.ChatState
dev.ai.elements.core.QueuedMessage
dev.ai.elements.core.ChatStatus
# Read-only collections of those models (they are never mutated after publishing).
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
